<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arco</title>
  <meta name="description" content="Generate brutalist buildings on a plinth, check that they stand and print, and export interlocking STLs.">
  <meta name="theme-color" content="#f2f0eb">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="vendor/three/three.module.min.js">
  <link rel="modulepreload" href="vendor/three/three.core.min.js">
  <link rel="stylesheet" href="css/arco.css">
</head>
<body data-mode="generate">
  <div class="stage" id="stage">
    <canvas id="scene" aria-label="Arco model view"></canvas>
    <svg class="overlay" id="overlay" aria-hidden="true"></svg>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <h1 class="wordmark" data-copy="wordmark">Arco</h1>
      <nav class="tabs" role="tablist" aria-label="Modes">
        <button role="tab" data-mode="generate" aria-selected="true" data-copy="tabGenerate"></button>
        <button role="tab" data-mode="collection" aria-selected="false" data-copy="tabCollection"></button>
        <button role="tab" data-mode="drawing" aria-selected="false" data-copy="tabDrawing"></button>
      </nav>
    </div>
    <!-- Logo slot: swap this one element for a drawn logo -->
    <div class="logo-slot" id="logoSlot" aria-hidden="true">x</div>
    <div class="topbar-right">
      <label class="toggle"><input type="checkbox" id="physicsToggle"><span data-copy="physics"></span></label>
      <label class="toggle"><input type="checkbox" id="sectionToggle"><span data-copy="section"></span></label>
      <button class="plain profile-button" id="profileButton" disabled data-copy="profile" data-copy-title="comingSoon"></button>
    </div>
    <div class="section-controls" id="sectionControls">
      <fieldset class="seg tight">
        <label><input type="radio" name="sectionAxis" value="h" checked><span data-copy="sectionHorizontal"></span></label>
        <label><input type="radio" name="sectionAxis" value="v"><span data-copy="sectionVertical"></span></label>
      </fieldset>
      <input type="range" id="sectionPosition" min="0" max="1000" value="500" aria-label="Section position">
    </div>
  </header>

  <button type="button" class="edge-tab edge-tab-left" id="leftTab" aria-controls="leftColumn" aria-expanded="false" data-copy="toolsTab"></button>
  <button type="button" class="edge-tab edge-tab-right" id="rightTab" aria-controls="rightColumn" aria-expanded="false" data-copy="inspectTab"></button>

  <aside class="column column-left" id="leftColumn" aria-label="Tools">
    <div class="mode-pane" data-pane="generate">
      <details class="panel" id="generateDrawer" data-drawer-key="arco.drawer.generate" data-drawer-default="open">
        <summary data-copy="generateTitle"></summary>
        <form class="drawer-body" id="generateForm">
          <fieldset class="seg wide">
            <legend data-copy="scale"></legend>
            <label><input type="radio" name="scale" value="unit"><span data-copy="scaleUnit"></span></label>
            <label><input type="radio" name="scale" value="block" checked><span data-copy="scaleBlock"></span></label>
            <label><input type="radio" name="scale" value="mega"><span data-copy="scaleMega"></span></label>
          </fieldset>
          <details class="sub" id="advancedSection" data-drawer-key="arco.advanced">
            <summary data-copy="advanced"></summary>
            <div class="sub-body">
              <fieldset class="seg">
                <legend data-copy="density"></legend>
                <label><input type="radio" name="density" value="0"><span data-copy="low"></span></label>
                <label><input type="radio" name="density" value="1" checked><span data-copy="mid"></span></label>
                <label><input type="radio" name="density" value="2"><span data-copy="high"></span></label>
              </fieldset>
              <fieldset class="seg">
                <legend data-copy="height"></legend>
                <label><input type="radio" name="height" value="0"><span data-copy="low"></span></label>
                <label><input type="radio" name="height" value="1" checked><span data-copy="mid"></span></label>
                <label><input type="radio" name="height" value="2"><span data-copy="high"></span></label>
              </fieldset>
              <fieldset class="seg">
                <legend data-copy="daring"></legend>
                <label><input type="radio" name="daring" value="0"><span data-copy="low"></span></label>
                <label><input type="radio" name="daring" value="1" checked><span data-copy="mid"></span></label>
                <label><input type="radio" name="daring" value="2"><span data-copy="high"></span></label>
              </fieldset>
              <fieldset class="seg">
                <legend data-copy="services"></legend>
                <label><input type="radio" name="services" value="off"><span data-copy="off"></span></label>
                <label><input type="radio" name="services" value="low" checked><span data-copy="low"></span></label>
                <label><input type="radio" name="services" value="high"><span data-copy="high"></span></label>
              </fieldset>
              <fieldset class="seg">
                <legend data-copy="budget"></legend>
                <label><input type="radio" name="budgetMode" value="fixed" checked><span data-copy="budgetFixed"></span></label>
                <label><input type="radio" name="budgetMode" value="custom"><span data-copy="budgetCustom"></span></label>
                <label><input type="radio" name="budgetMode" value="fantasy"><span data-copy="budgetFantasy"></span></label>
              </fieldset>
              <div class="field budget-cap">
                <label for="budgetCap" data-copy="budgetCap"></label>
                <input id="budgetCap" name="budgetCap" type="number" step="1" inputmode="numeric">
              </div>
              <label class="check"><input type="checkbox" id="allowUnstable" name="unstable"><span data-copy="allowUnstable"></span></label>
            </div>
          </details>
          <details class="sub" id="buildWithSection" data-drawer-key="arco.buildWith">
            <summary data-copy="buildWith"></summary>
            <div class="sub-body">
              <fieldset class="seg">
                <label><input type="checkbox" name="cat" value="social" checked><span data-copy="catSocial"></span></label>
                <label><input type="checkbox" name="cat" value="nature" checked><span data-copy="catNature"></span></label>
                <label><input type="checkbox" name="cat" value="industrial" checked><span data-copy="catIndustrial"></span></label>
                <label><input type="checkbox" name="cat" value="walled" checked><span data-copy="catWalled"></span></label>
                <label><input type="checkbox" name="cat" value="utilities" checked><span data-copy="catUtilities"></span></label>
              </fieldset>
            </div>
          </details>
          <details class="sub" id="showSection" data-drawer-key="arco.show">
            <summary data-copy="show"></summary>
            <div class="sub-body">
              <fieldset class="show-list">
                <label class="check"><input type="checkbox" id="perspectiveToggle"><span data-copy="viewPersp"></span></label>
                <label class="check"><input type="checkbox" id="decorToggle"><span data-copy="viewDecor"></span></label>
                <label class="check"><input type="checkbox" id="flowsToggle"><span data-copy="viewFlows"></span></label>
                <label class="check"><input type="checkbox" id="effectsToggle"><span data-copy="effects"></span></label>
                <label class="check"><input type="checkbox" id="skipAnimation"><span data-copy="viewSkip"></span></label>
              </fieldset>
            </div>
          </details>
          <input type="hidden" name="theme" value="1">
          <!-- Seed, Generate and the module count always stay last in this drawer -->
          <div class="field">
            <label for="seedInput" data-copy="seed"></label>
            <div class="field-row">
              <input id="seedInput" name="seed" type="text" maxlength="24" autocomplete="off" spellcheck="false">
              <button type="button" class="plain" id="newSeed" data-copy="newSeed"></button>
            </div>
          </div>
          <button type="submit" class="primary" id="generateButton" data-copy="generate"></button>
          <p class="status" id="budgetCount" role="status"></p>
          <p class="status" id="generateStatus" role="status"></p>
        </form>
      </details>

      <details class="panel" id="growDrawer" data-drawer-key="arco.drawer.grow">
        <summary data-copy="growTitle"></summary>
        <div class="drawer-body">
          <div class="field">
            <label for="growSize" data-copy="growSize"></label>
            <div class="stops">
              <input type="range" id="growSize" min="0" max="2" step="1" value="1">
              <div class="stop-labels" aria-hidden="true"><span>S</span><span>M</span><span>L</span></div>
            </div>
          </div>
          <label class="check"><input type="checkbox" id="growReplace"><span data-copy="growReplace"></span></label>
          <div class="button-grid">
            <button type="button" class="plain" id="growHere" aria-pressed="false" data-copy="growHere"></button>
            <button type="button" class="primary" id="growAll" data-copy="growAll"></button>
          </div>
          <p class="hint" id="growHint" data-copy="growHereHint" hidden></p>
          <p class="status" id="growStatus" role="status"></p>
        </div>
      </details>

      <details class="panel build-panel" id="buildDrawer" data-drawer-key="arco.drawer.build">
        <summary data-copy="buildTitle"></summary>
        <div class="drawer-body">
          <div class="button-grid">
            <button type="button" class="plain" id="buildRotate" data-copy="rotate"></button>
            <button type="button" class="plain" id="buildDelete" data-copy="remove"></button>
          </div>
          <div class="field-row">
            <input type="search" id="buildSearch" class="search" data-copy-placeholder="searchModules" aria-label="Search saved modules" autocomplete="off" spellcheck="false">
            <select id="buildCategory" class="select" aria-label="Category"></select>
          </div>
          <p class="empty" id="buildEmpty" data-copy="buildEmpty"></p>
          <ul class="cards" id="buildPalette"></ul>
          <p class="status" id="buildStatus" role="status"></p>
        </div>
      </details>
    </div>

    <div class="mode-pane" data-pane="drawing">
      <details class="panel" id="drawingDrawer" data-drawer-key="arco.drawer.drawing" data-drawer-default="open">
        <summary data-copy="drawingTitle"></summary>
        <div class="drawer-body">
          <fieldset class="seg wide">
            <legend data-copy="viewMenu"></legend>
            <label><input type="radio" name="drawingView" value="axon" checked><span data-copy="viewAxon"></span></label>
            <label><input type="radio" name="drawingView" value="plan"><span data-copy="viewPlan"></span></label>
            <label><input type="radio" name="drawingView" value="elevation"><span data-copy="viewElevation"></span></label>
          </fieldset>
          <label class="check"><input type="checkbox" id="showLoads" checked><span data-copy="showLoads"></span></label>
          <label class="check"><input type="checkbox" id="showCenters" checked><span data-copy="showCenters"></span></label>
          <label class="check"><input type="checkbox" id="showConnectors" checked><span data-copy="showConnectors"></span></label>
          <label class="check"><input type="checkbox" id="showServices" checked><span data-copy="showServices"></span></label>
          <label class="check"><input type="checkbox" id="showWalking"><span data-copy="showWalking"></span></label>
          <ul class="key">
            <li class="key-pass" data-copy="keyPass"></li>
            <li class="key-warn" data-copy="keyWarn"></li>
            <li class="key-fail" data-copy="keyFail"></li>
          </ul>
        </div>
      </details>
    </div>
  </aside>

  <aside class="column column-right" id="rightColumn" aria-label="Inspector">
    <section class="panel inspector-panel" aria-label="Selected module">
    <div class="inspector" id="inspectorBody"></div>
    <details class="drawer print-drawer" id="printDrawer" data-drawer-key="arco.drawer.print">
      <summary data-copy="printTitle"></summary>
      <div class="drawer-body">
        <button type="button" class="plain" id="exportModule" data-copy="exportModule"></button>
        <button type="button" class="plain" id="exportSelected" data-copy="exportSelection"></button>
        <button type="button" class="plain" id="exportAll" data-copy="exportEverything"></button>
        <div class="field">
          <label for="clearanceInput" data-copy="clearance"></label>
          <input id="clearanceInput" type="number">
        </div>
        <button type="button" class="plain" id="exportCoupon" data-copy="exportCoupon"></button>
        <button type="button" class="plain" id="assemblyOpen" data-copy="assembly"></button>
        <p class="hint" data-copy="exportNote"></p>
        <p class="status" id="exportStatus" role="status"></p>
      </div>
    </details>
    </section>
    <!-- Action box: always last on the right -->
    <section class="panel action-panel" aria-label="Module actions">
      <div class="button-grid">
        <button type="button" class="plain" id="duplicateModule" data-copy="duplicate" disabled></button>
        <button type="button" class="primary" id="saveModule" data-copy="save" disabled></button>
      </div>
    </section>
  </aside>

  <main class="archive" id="archive" aria-label="Collection">
    <section class="archive-inventory">
      <div class="archive-head">
        <h2 class="archive-title" data-copy="collectionTitle"></h2>
        <span class="archive-count" id="archiveCount"></span>
      </div>
      <div class="archive-tools">
        <input type="search" id="archiveSearch" class="search" data-copy-placeholder="searchModules" aria-label="Search the collection" autocomplete="off" spellcheck="false">
        <select id="archiveSort" class="select" aria-label="Sort">
          <option value="category" data-copy="sortCategory"></option>
          <option value="family" data-copy="sortFamily"></option>
          <option value="footprint" data-copy="sortFootprint"></option>
          <option value="saved" data-copy="sortSaved"></option>
        </select>
      </div>
      <div class="archive-tools">
        <button type="button" class="plain" id="archiveExport" data-copy="exportSelectedStl"></button>
        <button type="button" class="plain" id="collectionExport" data-copy="collectionExport"></button>
        <button type="button" class="plain" id="collectionImport" data-copy="collectionImport"></button>
        <input type="file" id="collectionFile" accept="application/json,.json" hidden>
      </div>
      <p class="hint archive-hint" data-copy="archiveHint"></p>
      <div class="archive-empty" id="archiveEmpty" hidden>
        <p class="archive-empty-title" data-copy="archiveEmptyTitle"></p>
        <p data-copy="archiveEmptyText"></p>
      </div>
      <ul class="cards archive-cards" id="collectionList"></ul>
    </section>
    <section class="archive-showroom">
      <div class="showroom-stage"><canvas id="showroom" aria-label="Selected module"></canvas></div>
      <div class="archive-actions">
        <button type="button" class="primary" id="archivePlace" data-copy="placeInBuild"></button>
        <button type="button" class="plain" id="archiveStl" data-copy="exportStl"></button>
        <button type="button" class="plain" id="archiveDelete" data-copy="confirmDelete"></button>
      </div>
      <p class="status archive-status" id="archiveStatus" role="status"></p>
      <div class="inspector" id="archiveInspector"></div>
    </section>
  </main>

  <div class="assembly" id="assemblyBar" hidden>
    <button class="plain" id="assemblyPrev" data-copy="assemblyPrev"></button>
    <span class="assembly-count" id="assemblyCount"></span>
    <button class="plain" id="assemblyNext" data-copy="assemblyNext"></button>
    <button class="plain" id="assemblyClose" data-copy="assemblyClose"></button>
  </div>

  <div class="title-block" id="titleBlock" aria-hidden="true"></div>

  <details class="legend" id="legend" open>
    <summary data-copy="legendTitle"></summary>
    <dl>
      <dt data-copy="legendOrbit"></dt><dd data-copy="legendOrbitKeys"></dd>
      <dt data-copy="legendZoom"></dt><dd data-copy="legendZoomKeys"></dd>
      <dt data-copy="legendPan"></dt><dd data-copy="legendPanKeys"></dd>
      <dt data-copy="legendSelect"></dt><dd data-copy="legendSelectKeys"></dd>
      <dt data-copy="legendMulti"></dt><dd data-copy="legendMultiKeys"></dd>
      <dt data-copy="legendFrame"></dt><dd data-copy="legendFrameKeys"></dd>
      <dt data-copy="legendReset"></dt><dd data-copy="legendResetKeys"></dd>
      <dt class="build-only" data-copy="legendPlace"></dt><dd class="build-only" data-copy="legendPlaceKeys"></dd>
      <dt class="build-only" data-copy="legendGrowHere"></dt><dd class="build-only" data-copy="legendGrowHereKeys"></dd>
      <dt class="build-only" data-copy="legendRotate"></dt><dd class="build-only" data-copy="legendRotateKeys"></dd>
      <dt class="build-only" data-copy="legendUndo"></dt><dd class="build-only" data-copy="legendUndoKeys"></dd>
      <dt class="build-only" data-copy="legendDelete"></dt><dd class="build-only" data-copy="legendDeleteKeys"></dd>
    </dl>
  </details>

  <p class="toast" id="toast" role="status" hidden></p>

  <script type="module" src="js/arco.js"></script>
</body>
</html>
